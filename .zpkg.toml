[package]
org = "zed-pkg"
name = "zed-qtcreator"
version = "0.1.0"
description = "Qt Creator plugin for Zed package insights and recommended resolutions"
license = "MIT"
keywords = ["zed-pkg", "package-manager"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-qtcreator"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "**/target/**", "**/node_modules/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."
adapter = "none"
